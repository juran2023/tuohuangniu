<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳拓荒牛 - 学习互动</title>
    <style>
        :root {
            --bg: #FFF8E7;
            --card-bg: #FFFFFF;
            --primary: #FF6B35;
            --primary-hover: #E55A2B;
            --accent-yellow: #FFD23F;
            --accent-teal: #06D6A0;
            --accent-pink: #EF476F;
            --accent-blue: #118AB2;
            --text-dark: #2D3436;
            --text-mid: #636E72;
            --text-light: #B2BEC3;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.10);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-full: 50%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255, 210, 63, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(6, 214, 160, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 30% 80%, rgba(239, 71, 111, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 70% 15%, rgba(17, 138, 178, 0.10) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* ========== 浮动装饰图案 ========== */
        .floating-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .deco {
            position: absolute;
            opacity: 0.7;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        /* 圆形 */
        .deco-circle {
            border-radius: 50%;
        }
        .deco-circle--1 {
            width: 50px;
            height: 50px;
            background: var(--accent-yellow);
            top: 8%;
            left: 8%;
            animation: floatCircle1 7s infinite;
        }
        .deco-circle--2 {
            width: 30px;
            height: 30px;
            background: var(--accent-teal);
            top: 70%;
            left: 85%;
            animation: floatCircle2 8s infinite;
        }
        .deco-circle--3 {
            width: 40px;
            height: 40px;
            background: var(--accent-pink);
            top: 15%;
            right: 10%;
            animation: floatCircle3 6.5s infinite;
        }
        .deco-circle--4 {
            width: 22px;
            height: 22px;
            background: var(--accent-blue);
            bottom: 12%;
            left: 15%;
            animation: floatCircle4 9s infinite;
        }
        .deco-circle--5 {
            width: 35px;
            height: 35px;
            background: var(--primary);
            top: 55%;
            left: 5%;
            animation: floatCircle5 7.5s infinite;
        }
        .deco-circle--6 {
            width: 28px;
            height: 28px;
            background: var(--accent-yellow);
            top: 25%;
            right: 18%;
            animation: floatCircle6 8.5s infinite;
        }

        /* 圆角方块 */
        .deco-square {
            border-radius: 8px;
        }
        .deco-square--1 {
            width: 35px;
            height: 35px;
            background: var(--accent-teal);
            top: 40%;
            right: 6%;
            transform: rotate(25deg);
            animation: floatSquare1 9s infinite;
        }
        .deco-square--2 {
            width: 28px;
            height: 28px;
            background: var(--accent-pink);
            bottom: 20%;
            right: 22%;
            transform: rotate(40deg);
            animation: floatSquare2 7s infinite;
        }
        .deco-square--3 {
            width: 32px;
            height: 32px;
            background: var(--accent-blue);
            top: 65%;
            left: 80%;
            transform: rotate(15deg);
            animation: floatSquare3 8s infinite;
        }

        /* 三角形 */
        .deco-triangle {
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 32px solid var(--accent-yellow);
            background: transparent !important;
            border-radius: 0 !important;
            top: 30%;
            left: 78%;
            animation: floatTriangle1 10s infinite;
        }
        .deco-triangle--2 {
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 26px solid var(--accent-pink);
            top: 75%;
            left: 35%;
            animation: floatTriangle2 9s infinite;
        }
        .deco-triangle--3 {
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 28px solid var(--accent-teal);
            top: 10%;
            left: 45%;
            animation: floatTriangle3 8s infinite;
        }

        /* 星形（用 ✦ 字符） */
        .deco-star {
            font-size: 32px;
            background: transparent !important;
            border-radius: 0 !important;
            animation: floatStar1 7s infinite;
        }
        .deco-star--1 {
            top: 50%;
            right: 14%;
            color: var(--accent-yellow);
            animation: floatStar1 7s infinite;
        }
        .deco-star--2 {
            top: 18%;
            left: 55%;
            color: var(--accent-pink);
            font-size: 24px;
            animation: floatStar2 8.5s infinite;
        }
        .deco-star--3 {
            bottom: 28%;
            right: 30%;
            color: var(--accent-teal);
            font-size: 28px;
            animation: floatStar3 9s infinite;
        }

        /* 小点点 */
        .deco-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .deco-dot--1 {
            background: var(--accent-yellow);
            top: 22%;
            left: 28%;
            animation: floatDot1 5s infinite;
        }
        .deco-dot--2 {
            background: var(--accent-teal);
            top: 58%;
            left: 60%;
            animation: floatDot2 6s infinite;
        }
        .deco-dot--3 {
            background: var(--accent-pink);
            top: 35%;
            left: 42%;
            animation: floatDot3 5.5s infinite;
        }
        .deco-dot--4 {
            background: var(--accent-blue);
            bottom: 15%;
            right: 10%;
            animation: floatDot4 6.5s infinite;
        }
        .deco-dot--5 {
            background: var(--primary);
            top: 45%;
            left: 70%;
            animation: floatDot5 5s infinite;
        }
        .deco-dot--6 {
            background: var(--accent-yellow);
            top: 80%;
            left: 50%;
            animation: floatDot6 7s infinite;
        }

        /* ========== 动画关键帧 ========== */
        @keyframes floatCircle1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(18px, -22px) scale(1.08);
            }
            50% {
                transform: translate(-8px, -28px) scale(0.94);
            }
            75% {
                transform: translate(-20px, -8px) scale(1.04);
            }
        }
        @keyframes floatCircle2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-16px, -18px) scale(1.1);
            }
            50% {
                transform: translate(-22px, 8px) scale(0.92);
            }
            75% {
                transform: translate(-6px, 16px) scale(1.05);
            }
        }
        @keyframes floatCircle3 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(14px, -16px) scale(1.06);
            }
            66% {
                transform: translate(-12px, -20px) scale(0.95);
            }
        }
        @keyframes floatCircle4 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(20px, -10px) scale(1.12);
            }
        }
        @keyframes floatCircle5 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-10px, -20px) scale(1.07);
            }
            75% {
                transform: translate(14px, -6px) scale(0.93);
            }
        }
        @keyframes floatCircle6 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-18px, -14px) scale(1.09);
            }
        }
        @keyframes floatSquare1 {
            0%,
            100% {
                transform: translate(0, 0) rotate(25deg);
            }
            50% {
                transform: translate(-14px, -18px) rotate(35deg);
            }
        }
        @keyframes floatSquare2 {
            0%,
            100% {
                transform: translate(0, 0) rotate(40deg);
            }
            50% {
                transform: translate(10px, -14px) rotate(28deg);
            }
        }
        @keyframes floatSquare3 {
            0%,
            100% {
                transform: translate(0, 0) rotate(15deg);
            }
            50% {
                transform: translate(-8px, -20px) rotate(30deg);
            }
        }
        @keyframes floatTriangle1 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-20px, -16px);
            }
        }
        @keyframes floatTriangle2 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(14px, -12px);
            }
        }
        @keyframes floatTriangle3 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-12px, -20px);
            }
        }
        @keyframes floatStar1 {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(-10px, -16px) rotate(15deg);
            }
        }
        @keyframes floatStar2 {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(8px, -14px) rotate(-10deg);
            }
        }
        @keyframes floatStar3 {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(-14px, -8px) rotate(12deg);
            }
        }
        @keyframes floatDot1 {
            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.7;
            }
            50% {
                transform: translate(12px, -10px);
                opacity: 1;
            }
        }
        @keyframes floatDot2 {
            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.6;
            }
            50% {
                transform: translate(-10px, -8px);
                opacity: 1;
            }
        }
        @keyframes floatDot3 {
            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.8;
            }
            50% {
                transform: translate(8px, -12px);
                opacity: 1;
            }
        }
        @keyframes floatDot4 {
            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.7;
            }
            50% {
                transform: translate(-14px, -6px);
                opacity: 1;
            }
        }
        @keyframes floatDot5 {
            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.6;
            }
            50% {
                transform: translate(6px, -14px);
                opacity: 1;
            }
        }
        @keyframes floatDot6 {
            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.7;
            }
            50% {
                transform: translate(-8px, -10px);
                opacity: 1;
            }
        }

        /* ========== 主卡片 ========== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 48px 40px 40px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 210, 63, 0.3);
        }
        .card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255, 210, 63, 0.35) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(6, 214, 160, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .card>* {
            position: relative;
            z-index: 1;
        }

        /* ========== 卡片内小图案 ========== */
        .card-emoji-top {
            font-size: 48px;
            margin-bottom: 6px;
            animation: bounceEmoji 2s infinite;
            display: inline-block;
        }
        @keyframes bounceEmoji {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }
        .card-emoji-bottom {
            font-size: 28px;
            margin-top: 20px;
            opacity: 0.6;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-emoji-bottom span {
            display: inline-block;
            animation: gentleFloat 3s infinite;
        }
        .card-emoji-bottom span:nth-child(1) {
            animation-delay: 0s;
        }
        .card-emoji-bottom span:nth-child(2) {
            animation-delay: 0.4s;
        }
        .card-emoji-bottom span:nth-child(3) {
            animation-delay: 0.8s;
        }
        .card-emoji-bottom span:nth-child(4) {
            animation-delay: 1.2s;
        }
        .card-emoji-bottom span:nth-child(5) {
            animation-delay: 1.6s;
        }
        @keyframes gentleFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ========== 标题 ========== */
        .title {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B35 0%, #EF476F 40%, #118AB2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-mid);
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        /* ========== 学习提示 ========== */
        .prompt-section {
            background: linear-gradient(135deg, #FFF8E7 0%, #FFF0DC 100%);
            border-radius: var(--radius-md);
            padding: 24px 20px;
            margin-bottom: 28px;
            border: 2px dashed rgba(255, 107, 53, 0.25);
            position: relative;
        }
        .prompt-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .prompt-label {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
            line-height: 1.6;
        }
        .prompt-hint {
            font-size: 13px;
            color: var(--text-mid);
            margin-top: 6px;
        }
        .prompt-section::after {
            content: '💡';
            position: absolute;
            top: -16px;
            right: 18px;
            font-size: 20px;
            animation: floatDot1 4s infinite;
        }

        /* ========== 输入框 ========== */
        .input-group {
            margin-bottom: 24px;
        }
        .input-word {
            width: 100%;
            padding: 16px 20px;
            font-size: 20px;
            border: 3px solid #E8E8E8;
            border-radius: var(--radius-md);
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
            background: #FAFAFA;
            color: var(--text-dark);
            font-weight: 500;
            letter-spacing: 1px;
        }
        .input-word:focus {
            border-color: var(--primary);
            background: #FFF;
            box-shadow: 0 0 0 8px rgba(255, 107, 53, 0.08);
        }
        .input-word::placeholder {
            color: #C0C0C0;
            font-weight: 400;
            font-size: 17px;
        }

        /* ========== 按钮 ========== */
        .btn-submit {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 700;
            color: #FFF;
            background: linear-gradient(135deg, #FF6B35 0%, #EF476F 100%);
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px rgba(255, 107, 53, 0.35);
            position: relative;
            overflow: hidden;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(255, 107, 53, 0.45);
            background: linear-gradient(135deg, #E55A2B 0%, #D93D5E 100%);
        }
        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.3);
        }
        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-submit:hover::after {
            opacity: 1;
        }

        /* ========== 成功提示 ========== */
        .success-message {
            display: none;
            margin-top: 20px;
            padding: 14px 20px;
            background: #E6FFF6;
            border-radius: var(--radius-sm);
            color: #06A77D;
            font-weight: 600;
            font-size: 15px;
            border: 2px solid rgba(6, 214, 160, 0.3);
            animation: fadeInUp 0.5s ease;
        }
        .success-message.show {
            display: block;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 模态弹窗 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-dialog {
            background: #FFF;
            border-radius: var(--radius-lg);
            padding: 40px 32px 32px;
            width: 90%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: modalIn 0.35s ease;
            position: relative;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        .modal-subtitle {
            font-size: 14px;
            color: var(--text-mid);
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 17px;
            border: 3px solid #E8E8E8;
            border-radius: var(--radius-sm);
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
            background: #FAFAFA;
            color: var(--text-dark);
            margin-bottom: 20px;
        }
        .modal-input:focus {
            border-color: var(--accent-teal);
            background: #FFF;
            box-shadow: 0 0 0 8px rgba(6, 214, 160, 0.08);
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .btn-cancel {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-mid);
            background: #F0F0F0;
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            background: #E4E4E4;
        }
        .btn-confirm {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            color: #FFF;
            background: linear-gradient(135deg, #06D6A0 0%, #118AB2 100%);
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(6, 214, 160, 0.3);
        }
        .btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(6, 214, 160, 0.4);
        }
        .btn-confirm:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: var(--radius-md);
            }
            .title {
                font-size: 28px;
            }
            .input-word {
                font-size: 17px;
                padding: 14px 16px;
            }
            .btn-submit {
                font-size: 17px;
                padding: 14px 24px;
            }
            .modal-dialog {
                padding: 28px 18px 24px;
            }
            .deco-triangle,
            .deco-triangle--2,
            .deco-triangle--3 {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 浮动装饰图案 ==================== -->
    <div class="floating-decorations">
        <!-- 圆形 -->
        <div class="deco deco-circle deco-circle--1"></div>
        <div class="deco deco-circle deco-circle--2"></div>
        <div class="deco deco-circle deco-circle--3"></div>
        <div class="deco deco-circle deco-circle--4"></div>
        <div class="deco deco-circle deco-circle--5"></div>
        <div class="deco deco-circle deco-circle--6"></div>
        <!-- 圆角方块 -->
        <div class="deco deco-square deco-square--1"></div>
        <div class="deco deco-square deco-square--2"></div>
        <div class="deco deco-square deco-square--3"></div>
        <!-- 三角形 -->
        <div class="deco deco-triangle deco-triangle--1"></div>
        <div class="deco deco-triangle deco-triangle--2"></div>
        <div class="deco deco-triangle deco-triangle--3"></div>
        <!-- 星形字符 -->
        <div class="deco deco-star deco-star--1">✦</div>
        <div class="deco deco-star deco-star--2">✧</div>
        <div class="deco deco-star deco-star--3">✦</div>
        <!-- 小圆点 -->
        <div class="deco deco-dot deco-dot--1"></div>
        <div class="deco deco-dot deco-dot--2"></div>
        <div class="deco deco-dot deco-dot--3"></div>
        <div class="deco deco-dot deco-dot--4"></div>
        <div class="deco deco-dot deco-dot--5"></div>
        <div class="deco deco-dot deco-dot--6"></div>
    </div>

    <!-- ==================== 主卡片 ==================== -->
    <div class="main-container">
        <div class="card">
            <!-- 顶部图案 -->
            <div class="card-emoji-top">🐂</div>

            <!-- 标题 -->
            <h1 class="title">深圳拓荒牛</h1>
            <p class="subtitle">—— 致敬敢闯敢试的深圳精神 ——</p>

            <!-- 学习提示 -->
            <div class="prompt-section">
                <div class="prompt-icon">📝</div>
                <p class="prompt-label">
                    你会用哪个词语来<strong>形容拓荒牛</strong>呢？<br>输入你的答案。
                </p>
                <p class="prompt-hint">例如：开拓、创新、奉献、敢闯敢试……</p>
            </div>

            <!-- 答案输入 -->
            <div class="input-group">
                <input
                type="text"
                id="wordInput"
                class="input-word"
                placeholder="在这里输入你的词语……"
                maxlength="20"
                autocomplete="off"
                />
            </div>

            <!-- 提交按钮 -->
            <button class="btn-submit" id="submitBtn" type="button">
                ✨ 提交答案
            </button>

            <!-- 成功提示 -->
            <div class="success-message" id="successMsg">
                ✅ 提交成功！感谢你的参与～
            </div>

            <!-- 底部图案 -->
            <div class="card-emoji-bottom">
                <span>🌟</span>
                <span>🐂</span>
                <span>💪</span>
                <span>🚀</span>
                <span>🏙️</span>
            </div>
        </div>
    </div>

    <!-- ==================== 姓名弹窗 ==================== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-dialog">
            <div class="modal-icon">👤</div>
            <h3 class="modal-title">填写姓名</h3>
            <p class="modal-subtitle">请输入你的姓名以完成提交</p>
            <input
            type="text"
            id="nameInput"
            class="modal-input"
            placeholder="请输入你的姓名……"
            maxlength="30"
            autocomplete="off"
            />
            <div class="modal-buttons">
                <button class="btn-cancel" id="btnCancel" type="button">取消</button>
                <button class="btn-confirm" id="btnConfirm" type="button">确认提交</button>
            </div>
        </div>
    </div>

    <!-- ==================== 脚本 ==================== -->
    <script>
        (function() {
            // ========== DOM 元素 ==========
            const wordInput = document.getElementById('wordInput');
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMsg');
            const modalOverlay = document.getElementById('modalOverlay');
            const nameInput = document.getElementById('nameInput');
            const btnCancel = document.getElementById('btnCancel');
            const btnConfirm = document.getElementById('btnConfirm');

            // 存储用户输入的词语
            let userWord = '';

            // ========== 工具函数 ==========
            function showSuccess() {
                successMsg.classList.add('show');
                setTimeout(() => {
                    successMsg.classList.remove('show');
                }, 4000);
            }

            function openModal() {
                modalOverlay.classList.add('active');
                nameInput.value = '';
                nameInput.focus();
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                nameInput.value = '';
            }

            function setLoading(button, loading) {
                if (loading) {
                    button.disabled = true;
                    button.dataset.originalText = button.textContent;
                    button.textContent = '提交中……';
                } else {
                    button.disabled = false;
                    button.textContent = button.dataset.originalText || button.textContent;
                }
            }

            // ========== 数据提交 ==========
            async function submitData(word, name) {
                const payload = {
                    word: word,
                    name: name,
                    timestamp: new Date().toISOString(),
                };

                const response = await fetch('https://quickform.cn/api/8qy6sjw6vp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(`服务器返回状态码: ${response.status}`);
                }

                const result = await response.json();
                return result;
            }

            // ========== 事件监听 ==========

            // 1. 点击"提交答案"
            submitBtn.addEventListener('click', () => {
                const word = wordInput.value.trim();

                if (!word) {
                    // 轻提示效果：输入框抖动
                    wordInput.style.borderColor = '#EF476F';
                    wordInput.style.animation = 'shake 0.5s ease';
                    wordInput.placeholder = '请先输入一个词语再提交哦～';
                    setTimeout(() => {
                        wordInput.style.borderColor = '#E8E8E8';
                        wordInput.style.animation = '';
                        wordInput.placeholder = '在这里输入你的词语……';
                    }, 2000);
                    wordInput.focus();
                    return;
                }

                // 保存词语并打开姓名弹窗
                userWord = word;
                openModal();
            });

            // 2. 回车键也可触发提交
            wordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitBtn.click();
                }
            });

            // 3. 弹窗中按回车确认
            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnConfirm.click();
                }
            });

            // 4. 取消按钮
            btnCancel.addEventListener('click', () => {
                closeModal();
            });

            // 5. 点击遮罩关闭弹窗
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            // 6. 确认提交
            btnConfirm.addEventListener('click', async () => {
                const name = nameInput.value.trim();

                if (!name) {
                    nameInput.style.borderColor = '#EF476F';
                    nameInput.placeholder = '请输入姓名～';
                    nameInput.focus();
                    setTimeout(() => {
                        nameInput.style.borderColor = '#E8E8E8';
                        nameInput.placeholder = '请输入你的姓名……';
                    }, 2000);
                    return;
                }

                // 开始提交
                setLoading(btnConfirm, true);

                try {
                    await submitData(userWord, name);
                    // 提交成功
                    closeModal();
                    showSuccess();
                    wordInput.value = '';
                    userWord = '';
                } catch (error) {
                    console.error('提交失败:', error);
                    alert('提交失败，请检查网络后重试。\n错误信息: ' + error.message);
                } finally {
                    setLoading(btnConfirm, false);
                }
            });

            // ========== 输入框抖动动画 ==========
            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = `
                    @keyframes shake {
                        0%, 100% { transform: translateX(0); }
                        20%      { transform: translateX(-6px); }
                        40%      { transform: translateX(6px); }
                        60%      { transform: translateX(-4px); }
                        80%      { transform: translateX(4px); }
                    }
                `;
            document.head.appendChild(shakeStyle);

            console.log('🐂 深圳拓荒牛 - 学习互动页面已就绪');
        })();
    </script>
</body>
</html>
